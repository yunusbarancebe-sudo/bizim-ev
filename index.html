<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bizim Ev</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; padding-bottom: 110px; }
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 antialiased min-h-screen">

  <header class="sticky top-0 z-40 bg-[#09090b]/90 backdrop-blur-xl border-b border-zinc-800 safe-top">
    <div class="flex justify-between items-center px-5 py-3">
      <div>
        <p class="text-[10px] font-bold tracking-widest uppercase text-zinc-500">Hane Yönetimi</p>
        <h1 id="sayfaBaslik" class="text-2xl font-black tracking-tight text-white">Kiler & Stok</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="verileriYukle(true)" class="w-9 h-9 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 active:scale-95"><i id="yenileIcon" class="fa-solid fa-arrows-rotate text-xs"></i></button>
        <button onclick="modalAc()" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30 active:scale-95"><i class="fa-solid fa-plus text-sm"></i></button>
      </div>
    </div>
  </header>

  <div id="senkRozeti" class="fixed top-20 right-5 z-50 bg-indigo-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 hidden">
    <div class="w-2 h-2 rounded-full bg-white animate-ping"></div> İşleniyor...
  </div>

  <main class="p-4 space-y-4 max-w-lg mx-auto">
    <!-- KİLER -->
    <section id="tab-kiler" class="space-y-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
        <button onclick="kilerFiltrele('Tümü')" class="kiler-filtre-btn active px-3.5 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white whitespace-nowrap">Tümü</button>
        <button onclick="kilerFiltrele('Gıda & Mutfak')" class="kiler-filtre-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">Gıda & Mutfak</button>
        <button onclick="kilerFiltrele('Temizlik & Hijyen')" class="kiler-filtre-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">Temizlik & Hijyen</button>
        <button onclick="kilerFiltrele('Kişisel Bakım')" class="kiler-filtre-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">Kişisel Bakım</button>
        <button onclick="kilerFiltrele('Ev & Yaşam')" class="kiler-filtre-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap">Ev & Yaşam</button>
      </div>
      <div id="sktUyariAlani"></div>
      <div id="kilerListe" class="space-y-2.5"></div>
    </section>

    <!-- FİNANS -->
    <section id="tab-finans" class="space-y-4 hidden">
      <div class="flex items-center justify-between bg-zinc-900 border border-zinc-800 p-2.5 rounded-2xl">
        <span class="text-xs font-bold text-zinc-400 pl-2"><i class="fa-regular fa-calendar-days text-indigo-400 mr-1.5"></i> Dönem</span>
        <div class="flex gap-2">
          <select id="finansAySec" onchange="ekraniGuncelle()" class="bg-zinc-800 border border-zinc-700 text-xs font-bold text-zinc-200 px-3 py-1.5 rounded-xl outline-none">
            <option value="01">Ocak</option><option value="02">Şubat</option><option value="03">Mart</option>
            <option value="04">Nisan</option><option value="05">Mayıs</option><option value="06">Haziran</option>
            <option value="07">Temmuz</option><option value="08">Ağustos</option><option value="09">Eylül</option>
            <option value="10">Ekim</option><option value="11">Kasım</option><option value="12">Aralık</option>
          </select>
          <select id="finansYilSec" onchange="ekraniGuncelle()" class="bg-zinc-800 border border-zinc-700 text-xs font-bold text-zinc-200 px-3 py-1.5 rounded-xl outline-none">
            <option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option>
          </select>
        </div>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-3xl space-y-3">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
          <div><span class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider">Net Kalan</span><p id="netKalan" class="text-2xl font-black text-white mt-0.5">₺0</p></div>
          <div class="text-right"><span class="text-[10px] uppercase font-bold text-emerald-500 tracking-wider">Toplam Maaş</span><p id="toplamGelir" class="text-sm font-extrabold text-emerald-400 mt-0.5">₺0</p></div>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-zinc-950 p-2.5 rounded-2xl border border-zinc-800"><span class="text-zinc-500 block text-[10px]">Maaş (Ben)</span><span id="maasBenTutar" class="font-bold text-zinc-200">₺0</span></div>
          <div class="bg-zinc-950 p-2.5 rounded-2xl border border-zinc-800"><span class="text-zinc-500 block text-[10px]">Maaş (Eşim)</span><span id="maasEsimTutar" class="font-bold text-zinc-200">₺0</span></div>
          <div class="bg-zinc-950 p-2.5 rounded-2xl border border-zinc-800"><span class="text-zinc-500 block text-[10px]">Faturalar & Aidat</span><span id="toplamFatura" class="font-bold text-amber-400">₺0</span></div>
          <div class="bg-zinc-950 p-2.5 rounded-2xl border border-zinc-800"><span class="text-zinc-500 block text-[10px]">Harcamalar</span><span id="toplamGider" class="font-bold text-rose-400">₺0</span></div>
        </div>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-3xl space-y-2.5">
        <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-400"><i class="fa-solid fa-chart-pie text-indigo-400 mr-1.5"></i> Gider Kırılımı</h3>
        <div id="kategoriKirilimListe" class="space-y-2 pt-1 text-xs"></div>
      </div>
      <div class="space-y-2"><h3 class="text-xs font-bold uppercase tracking-wider text-zinc-500 px-1">İşlem Geçmişi</h3><div id="finansListe" class="space-y-2"></div></div>
    </section>

    <!-- ALIŞVERİŞ -->
    <section id="tab-alisveris" class="space-y-3 hidden"><div id="alisverisListe" class="space-y-2.5"></div></section>

    <!-- İSTEKLER -->
    <section id="tab-istekler" class="space-y-3 hidden"><div id="istekListe" class="grid grid-cols-1 gap-2.5"></div></section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#09090b]/90 backdrop-blur-xl border-t border-zinc-800 safe-bottom">
    <div class="max-w-lg mx-auto px-6 py-2 flex justify-between">
      <button onclick="sekmeDegistir('kiler', 'Kiler & Stok')" class="nav-btn active flex flex-col items-center py-1 text-indigo-400" data-tab="kiler"><i class="fa-solid fa-boxes-stacked text-base mb-1"></i><span class="text-[10px] font-semibold mt-1">Kiler</span></button>
      <button onclick="sekmeDegistir('finans', 'Finans & Faturalar')" class="nav-btn flex flex-col items-center py-1 text-zinc-500" data-tab="finans"><i class="fa-solid fa-wallet text-base mb-1"></i><span class="text-[10px] font-semibold mt-1">Finans</span></button>
      <button onclick="sekmeDegistir('alisveris', 'Alışveriş')" class="nav-btn flex flex-col items-center py-1 text-zinc-500" data-tab="alisveris"><i class="fa-solid fa-basket-shopping text-base mb-1"></i><span class="text-[10px] font-semibold mt-1">Alışveriş</span></button>
      <button onclick="sekmeDegistir('istekler', 'İstek Listesi')" class="nav-btn flex flex-col items-center py-1 text-zinc-500" data-tab="istekler"><i class="fa-solid fa-gift text-base mb-1"></i><span class="text-[10px] font-semibold mt-1">İstekler</span></button>
    </div>
  </nav>

  <!-- FORM MODAL -->
  <div id="formModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm items-end sm:items-center justify-center p-0 sm:p-4" onclick="modalDisTiklama(event)">
    <div class="bg-zinc-900 border border-zinc-800 rounded-t-[32px] sm:rounded-3xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto space-y-4 safe-bottom shadow-2xl relative" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 id="modalBaslik" class="font-bold text-base text-zinc-100">Yeni Ekle</h3>
        <button type="button" onclick="modalKapat()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center font-bold text-lg active:scale-90">&times;</button>
      </div>
      <div id="modalGovde" class="space-y-3"></div>
      <div id="kameraKutusu" class="hidden rounded-2xl overflow-hidden border border-zinc-800 bg-black">
        <div id="reader" style="width: 100%;"></div>
        <button type="button" onclick="kameraKapat()" class="w-full bg-zinc-800 py-2.5 text-xs font-semibold text-zinc-300">Kamerayı Kapat</button>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="modalKapat()" class="w-1/3 bg-zinc-800 text-zinc-300 py-3.5 rounded-2xl font-bold active:scale-95">Vazgeç</button>
        <button type="button" id="kaydetBtn" onclick="formKaydet()" class="flex-1 bg-indigo-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-indigo-600/30 active:scale-95">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ APPS SCRIPT /EXEC BAĞLANTINIZI BURAYA GİRİN:
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwzXQN3-bZx8QEg6nfuoNNqadBbndXWiEw7PFxZFPA4edAn69gdJnyNPrznq14Q4VcZ/exec";

    let aktifSekme = 'kiler', seciliKilerKategori = 'Tümü', html5QrCode = null, linkDebounceTimer = null;
    let appVerisi = { kiler: [], finans: [], alisveris: [], istekler: [], barkodHavuzu: [] };
    
    try {
      const cached = localStorage.getItem('bizimEvVerisi');
      if (cached && cached !== "undefined") {
        const parsed = JSON.parse(cached);
        if (parsed && typeof parsed === 'object') appVerisi = parsed;
      }
    } catch (e) {}

    window.onload = function() {
      const simdi = new Date();
      document.getElementById('finansAySec').value = String(simdi.getMonth() + 1).padStart(2, '0');
      document.getElementById('finansYilSec').value = String(simdi.getFullYear());
      ekraniGuncelle();
      if (API_URL && !API_URL.includes("BURAYA_EXEC")) verileriYukle(false);
    };

    function verileriYukle(gosterAnim) {
      if (!API_URL || API_URL.includes("BURAYA_EXEC")) return;
      if (gosterAnim) document.getElementById('yenileIcon').classList.add('animate-spin');
      fetch(`${API_URL}?islem=verileriGetir`).then(res => res.json()).then(data => {
          appVerisi = data; localStorage.setItem('bizimEvVerisi', JSON.stringify(data)); ekraniGuncelle();
      }).finally(() => document.getElementById('yenileIcon').classList.remove('animate-spin'));
    }

    function arkaPlanSenkronize(paramsObj) {
      document.getElementById('senkRozeti').classList.remove('hidden');
      fetch(API_URL, { method: 'POST', body: JSON.stringify(paramsObj) })
      .then(res => res.json()).then(data => {
        appVerisi = data; localStorage.setItem('bizimEvVerisi', JSON.stringify(data)); ekraniGuncelle();
      }).finally(() => document.getElementById('senkRozeti').classList.add('hidden'));
    }

    function sekmeDegistir(sekme, baslik) {
      aktifSekme = sekme; document.getElementById('sayfaBaslik').innerText = baslik;
      ['kiler', 'finans', 'alisveris', 'istekler'].forEach(s => document.getElementById('tab-' + s).classList.add('hidden'));
      document.getElementById('tab-' + sekme).classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('text-indigo-400', btn.dataset.tab === sekme);
        btn.classList.toggle('text-zinc-500', btn.dataset.tab !== sekme);
      });
    }

    function kilerFiltrele(kat) {
      seciliKilerKategori = kat;
      document.querySelectorAll('.kiler-filtre-btn').forEach(b => {
        b.className = b.innerText === kat 
          ? "kiler-filtre-btn active px-3.5 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white whitespace-nowrap"
          : "kiler-filtre-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-zinc-800 text-zinc-400 whitespace-nowrap";
      });
      ekraniGuncelle();
    }

    function modalDisTiklama(e) { if (e.target.id === 'formModal') modalKapat(); }

    function modalAc() {
      const modal = document.getElementById('formModal');
      const g = document.getElementById('modalGovde'); 
      g.innerHTML = '';
      document.getElementById('kameraKutusu').classList.add('hidden');
      
      if (aktifSekme === 'kiler') {
        document.getElementById('modalBaslik').innerText = 'Kilere Ürün Ekle';
        g.innerHTML = `
          <div class="flex gap-2">
            <input id="f_barkod" type="text" placeholder="Barkod Tara / Yaz" class="flex-1 bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <button type="button" onclick="kameraAc()" class="bg-indigo-600 px-4 rounded-xl text-white active:scale-95"><i class="fa-solid fa-barcode"></i> Tara</button>
          </div>
          <p id="barkodDurum" class="text-[11px] hidden"></p>
          <input id="f_ad" type="text" placeholder="Ürün Adı (Yoksa siz yazın)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <select id="f_kategori" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Gıda & Mutfak">Kategori: Gıda & Mutfak</option><option value="Temizlik & Hijyen">Kategori: Temizlik & Hijyen</option>
            <option value="Kişisel Bakım">Kategori: Kişisel Bakım</option><option value="Ev & Yaşam">Kategori: Ev & Yaşam</option>
          </select>
          <input id="f_resim" type="hidden">
          <div class="grid grid-cols-2 gap-2">
            <input id="f_stok" type="number" placeholder="Eklenecek Adet" value="1" class="bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <input id="f_birim" type="text" placeholder="Birim (Adet, Lt)" value="Adet" class="bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          </div>
          <div>
            <label class="block text-[11px] text-zinc-400 mb-1 font-semibold">Son Kullanma Tarihi (SKT)</label>
            <input id="f_skt" type="date" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          </div>`;
        setTimeout(() => document.getElementById('f_barkod').addEventListener('change', function() { barkodlaUrunAra(this.value.trim()); }), 50);
      } else if (aktifSekme === 'finans') {
        document.getElementById('modalBaslik').innerText = 'Finans / Harcama Ekle';
        g.innerHTML = `
          <select id="f_tip" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Gider">Günlük Harcama (Gider)</option><option value="Fatura">Fatura / Aidat</option>
            <option value="Maas_Ben">Maaş (Ben)</option><option value="Maas_Esim">Maaş (Eşim)</option>
          </select>
          <input id="f_tarih" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_kategori" type="text" placeholder="Kategori (Aidat, Market vb.)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_tutar" type="number" placeholder="Tutar (₺)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <select id="f_kisi" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Ben">Kişi: Ben</option><option value="Eşim">Kişi: Eşim</option><option value="Ortak">Ortak Hane</option>
          </select>
          <input id="f_not" type="text" placeholder="Açıklama / Not" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">`;
      } else if (aktifSekme === 'alisveris') {
        document.getElementById('modalBaslik').innerText = 'Alışverişe Ürün Ekle';
        g.innerHTML = `
          <input id="f_urun" type="text" placeholder="Alınacak Ürün Adı" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_adet" type="number" value="1" placeholder="Adet" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <select id="f_ekleyen" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Ben">Ekleyen: Ben</option><option value="Eşim">Ekleyen: Eşim</option>
          </select>`;
      } else if (aktifSekme === 'istekler') {
        document.getElementById('modalBaslik').innerText = 'İstek / Wishlist Ekle';
        g.innerHTML = `
          <div class="space-y-1">
            <input id="f_link" type="text" oninput="akilliLinkCozucu(this.value)" placeholder="Ürün Linki Yapıştır (Trendyol, Amazon)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <p id="linkDurum" class="text-[11px] hidden"></p>
          </div>
          <input id="f_ad" type="text" placeholder="Ürün Adı (Linkten okunur)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_fiyat" type="number" placeholder="Fiyatı (₺)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_resim" type="hidden">
          <select id="f_ekleyen" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Ben">Ekleyen: Ben</option><option value="Eşim">Ekleyen: Eşim</option>
          </select>`;
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function modalKapat() { 
      try { kameraKapat(); } catch (e) {} 
      const modal = document.getElementById('formModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function barkodlaUrunAra(barkod) {
      if (!barkod) return;
      const d = document.getElementById('barkodDurum');
      d.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Havuzunuzda aranıyor...'; 
      d.className = "text-[11px] text-indigo-400 font-bold block";

      // 1. Önce senin "Barkod Havuzu"na bakar
      const havuz = appVerisi.barkodHavuzu || [];
      const yerel = havuz.find(u => String(u[0]) === String(barkod));
      if (yerel) {
        document.getElementById('f_ad').value = yerel[1] || '';
        if (yerel[3]) document.getElementById('f_kategori').value = yerel[3];
        d.innerHTML = `<i class="fa-solid fa-circle-check"></i> Kendi havuzunuzdan bulundu!`;
        d.className = "text-[11px] text-emerald-400 font-bold block";
        return;
      }

      // 2. Bulamazsa Açık Veritabanına sor
      try {
        const offRes = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barkod}.json`);
        const offData = await offRes.json();
        if (offData.status === 1 && (offData.product.product_name_tr || offData.product.product_name)) {
          document.getElementById('f_ad').value = offData.product.product_name_tr || offData.product.product_name;
          document.getElementById('f_kategori').value = "Gıda & Mutfak";
          d.innerHTML = `<i class="fa-solid fa-circle-check"></i> İnternetten bulundu!`;
          d.className = "text-[11px] text-emerald-400 font-bold block";
          return;
        }
      } catch(e) {}

      // 3. Hiçbiri bulamazsa Kendi Havuzuna kaydetmesi için uyar
      d.innerHTML = `<i class="fa-solid fa-circle-plus"></i> Ürün yeni! <b>Adını bir kez girin</b>, sonsuza dek havuzunuza kaydedilsin.`;
      d.className = "text-[11px] text-amber-400 font-bold block";
    }

    // YENİ: HİÇBİR SİTEYE BAĞLANMAYAN, ENGELLENEMEZ LİNK ÇÖZÜCÜ
    function akilliLinkCozucu(url) {
      clearTimeout(linkDebounceTimer);
      if (!url || !url.startsWith("http")) return;

      linkDebounceTimer = setTimeout(() => {
        const d = document.getElementById('linkDurum');
        d.classList.remove('hidden');
        d.innerHTML = '<i class="fa-solid fa-bolt text-amber-400"></i> Link analiz ediliyor...';
        
        try {
          const u = new URL(url);
          const path = decodeURIComponent(u.pathname);
          let slug = "";
          
          if (u.hostname.includes('trendyol.com')) {
            slug = path.split('/').pop().split('-p-')[0];
          } else if (u.hostname.includes('hepsiburada.com')) {
            slug = path.split('/').pop().split('-pm-')[0];
          } else if (u.hostname.includes('amazon.com.tr') || u.hostname.includes('amazon.')) {
            const parts = path.split('/');
            if (parts.length > 1 && parts[1] !== 'dp') slug = parts[1];
            else if (parts.length > 2 && parts[2] !== 'dp') slug = parts[2];
          } else if (u.hostname.includes('ciceksepeti.com')) {
            slug = path.split('/').pop().split('-kc')[0];
          } else {
            slug = path.split('/').filter(p => p.length > 0).pop().split('?')[0].split('-p-')[0];
          }

          if (slug && slug.length > 3) {
            let ad = slug.replace(/[-_]/g, ' ');
            ad = ad.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
            
            document.getElementById('f_ad').value = ad;
            d.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> <b>Ürün Adı Bulundu:</b> ${ad} <br><span class="text-zinc-500 font-normal">Fiyatı manuel giriniz.</span>`;
          } else {
             d.innerHTML = `<i class="fa-solid fa-info-circle text-indigo-400"></i> Lütfen ürün adını kendiniz giriniz.`;
          }
        } catch(e) {
             d.innerHTML = `<i class="fa-solid fa-info-circle text-indigo-400"></i> Lütfen ürün adını kendiniz giriniz.`;
        }
      }, 500);
    }

    function formKaydet() {
      let payload = { islem: '' };
      if (aktifSekme === 'kiler') {
        payload = { islem: 'kilerEkle', ad: document.getElementById('f_ad').value, barkod: document.getElementById('f_barkod').value, stok: document.getElementById('f_stok').value, birim: document.getElementById('f_birim').value, skt: document.getElementById('f_skt').value, resim: document.getElementById('f_resim').value, kategori: document.getElementById('f_kategori').value, kritik: '1' };
        
        // Mükerrer Kontrolü ve Optimizasyon (Arayüzde anında güncelleme)
        let index = -1;
        if(payload.barkod) index = appVerisi.kiler.findIndex(u => u[1] === payload.barkod);
        if(index === -1 && payload.ad) index = appVerisi.kiler.findIndex(u => u[0].toLowerCase() === payload.ad.toLowerCase());

        if(index !== -1) {
           appVerisi.kiler[index][2] = String(Number(appVerisi.kiler[index][2]) + Number(payload.stok));
           if(payload.skt) appVerisi.kiler[index][5] = payload.skt; 
        } else {
           appVerisi.kiler.push([payload.ad, payload.barkod, payload.stok, payload.birim, payload.kritik, payload.skt, payload.resim, payload.kategori]);
        }
        
        if(payload.barkod && payload.ad && !appVerisi.barkodHavuzu.find(u => u[0] == payload.barkod)) {
          appVerisi.barkodHavuzu.push([payload.barkod, payload.ad, payload.resim, payload.kategori]);
        }
      } else if (aktifSekme === 'finans') {
        payload = { islem: 'finansEkle', tip: document.getElementById('f_tip').value, tarih: document.getElementById('f_tarih').value, kategori: document.getElementById('f_kategori').value || 'Diğer', tutar: document.getElementById('f_tutar').value, kisi: document.getElementById('f_kisi').value, not: document.getElementById('f_not').value };
        appVerisi.finans.unshift([payload.tarih, payload.tip, payload.kategori, payload.tutar, payload.kisi, payload.not]);
      } else if (aktifSekme === 'alisveris') {
        payload = { islem: 'alisverisEkle', urun: document.getElementById('f_urun').value, adet: document.getElementById('f_adet').value, ekleyen: document.getElementById('f_ekleyen').value };
        appVerisi.alisveris.push([payload.urun, payload.adet, payload.ekleyen, 'Bugün', 'Bekliyor']);
      } else if (aktifSekme === 'istekler') {
        payload = { islem: 'istekEkle', link: document.getElementById('f_link').value, ad: document.getElementById('f_ad').value, fiyat: document.getElementById('f_fiyat').value, ekleyen: document.getElementById('f_ekleyen').value, resim: document.getElementById('f_resim').value };
        appVerisi.istekler.push([payload.link, payload.ad, payload.fiyat, payload.ekleyen, payload.resim]);
      }
      ekraniGuncelle(); modalKapat();
      if (API_URL && !API_URL.includes("BURAYA_EXEC")) arkaPlanSenkronize(payload);
    }

    function kilerUrunBitti(index, ad) {
      if (confirm(`Stoğu sıfırlanıp Alışveriş Listesine aktarılsın mı?`)) {
        appVerisi.kiler[index][2] = "0";
        appVerisi.alisveris.push([ad, '1', 'Kiler', 'Bugün', 'Bekliyor']);
        ekraniGuncelle();
        if (API_URL && !API_URL.includes("BURAYA_EXEC")) arkaPlanSenkronize({ islem: 'kilerBitti', index: index, ad: ad });
      }
    }

    function alisverisDurumDegistir(index, mevcutDurum) {
      const yeniDurum = mevcutDurum === 'Alındı' ? 'Bekliyor' : 'Alındı';
      appVerisi.alisveris[index][4] = yeniDurum;
      ekraniGuncelle();
      if (API_URL && !API_URL.includes("BURAYA_EXEC")) arkaPlanSenkronize({ islem: 'alisverisDurum', index: index, durum: yeniDurum });
    }

    function alisverisSil(index) {
      if(confirm("Listeden silinsin mi?")) {
        appVerisi.alisveris.splice(index, 1); ekraniGuncelle();
        if (API_URL && !API_URL.includes("BURAYA_EXEC")) arkaPlanSenkronize({ islem: 'alisverisSil', index: index });
      }
    }

    function istekSil(index) {
      if(confirm("İstek listesinden kaldırılsın mı?")) {
        appVerisi.istekler.splice(index, 1); ekraniGuncelle();
        if (API_URL && !API_URL.includes("BURAYA_EXEC")) arkaPlanSenkronize({ islem: 'istekSil', index: index });
      }
    }

    function ekraniGuncelle() {
      try {
        const kBox = document.getElementById('kilerListe'); const sktBox = document.getElementById('sktUyariAlani');
        kBox.innerHTML = ''; sktBox.innerHTML = ''; let sktKritik = [];
        const bugun = new Date(); bugun.setHours(0,0,0,0);

        (appVerisi.kiler || []).forEach((item, index) => {
          const ad = item[0]||'', barkod = item[1]||'', stok = Number(item[2])||0, birim = item[3]||'Adet', skt = item[5], resim = item[6], kat = item[7]||'Gıda & Mutfak';
          if (seciliKilerKategori !== 'Tümü' && kat !== seciliKilerKategori) return;

          let fark = null, sktBadge = '';
          if(skt && typeof skt === 'string' && skt.includes('-')){ 
            const p=skt.split('-'); fark = Math.ceil((new Date(Number(p[0]), Number(p[1])-1, Number(p[2])) - bugun)/86400000); 
          }
          if (fark !== null) {
            if (fark < 0) { sktBadge = `<span class="bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded text-[10px] font-bold">Tarihi Geçti</span>`; sktKritik.push(`${ad} (${Math.abs(fark)} gün geçti)`); }
            else if (fark <= 3) { sktBadge = `<span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded text-[10px] font-bold">Son ${fark} Gün</span>`; sktKritik.push(`${ad} (Son ${fark} gün)`); }
          }
          
          const safeAd = ad.replace(/'/g, "\\'"); 
          
          kBox.innerHTML += `
            <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl space-y-2.5">
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center text-zinc-500"><i class="fa-solid fa-box text-sm"></i></div>
                  <div><p class="font-bold text-sm">${ad}</p><div class="flex items-center gap-2 mt-0.5">${sktBadge}<span class="text-[10px] text-zinc-500">${kat}</span></div></div>
                </div>
                <span class="px-2.5 py-1 rounded-xl bg-zinc-800 text-xs font-black ${stok===0?'text-rose-400':'text-zinc-200'}">${stok} ${birim}</span>
              </div>
              <div class="flex justify-end pt-1 border-t border-zinc-800/60">
                <button onclick="kilerUrunBitti(${index}, '${safeAd}')" class="text-[11px] font-bold text-amber-400 bg-amber-500/10 px-3 py-1.5 rounded-xl border border-amber-500/20"><i class="fa-solid fa-cart-plus"></i> Bitti → Alışverişe Ekle</button>
              </div>
            </div>`;
        });
        if(sktKritik.length>0) sktBox.innerHTML = `<div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl text-xs text-amber-400 font-bold mb-2">⚠ SKT Uyarısı: ${sktKritik.join(', ')}</div>`;

        const donemFiltre = `${document.getElementById('finansYilSec').value}-${document.getElementById('finansAySec').value}`;
        let mBen=0, mEsim=0, ftr=0, gdr=0, kirilim={};
        const fBox = document.getElementById('finansListe'); fBox.innerHTML = '';
        
        (appVerisi.finans || []).forEach(item => {
          const tStr = item[0]||'';
          if (!tStr.startsWith || !tStr.startsWith(donemFiltre)) return;
          const tip=item[1], kat=item[2]||'Diğer', t=Number(item[3])||0;
          if(tip==='Maas_Ben') mBen+=t; else if(tip==='Maas_Esim') mEsim+=t;
          else if(tip==='Fatura'){ ftr+=t; kirilim[kat]=(kirilim[kat]||0)+t; }
          else{ gdr+=t; kirilim[kat]=(kirilim[kat]||0)+t; }
          fBox.innerHTML += `<div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex justify-between"><div><p class="font-bold text-sm">${kat}</p><p class="text-[11px] text-zinc-500">${tStr} • ${item[4]}</p></div><span class="font-black text-sm ${tip.startsWith('Maas')?'text-emerald-400':(tip==='Fatura'?'text-amber-400':'text-rose-400')}">${tip.startsWith('Maas')?'+':'-'}₺${t.toLocaleString('tr-TR')}</span></div>`;
        });
        
        document.getElementById('maasBenTutar').innerText='₺'+(mBen||0).toLocaleString('tr-TR');
        document.getElementById('maasEsimTutar').innerText='₺'+(mEsim||0).toLocaleString('tr-TR');
        document.getElementById('toplamFatura').innerText='₺'+(ftr||0).toLocaleString('tr-TR');
        document.getElementById('toplamGider').innerText='₺'+(gdr||0).toLocaleString('tr-TR');
        document.getElementById('toplamGelir').innerText='₺'+(mBen+mEsim).toLocaleString('tr-TR');
        document.getElementById('netKalan').innerText='₺'+((mBen+mEsim)-(ftr+gdr)).toLocaleString('tr-TR');

        const krBox = document.getElementById('kategoriKirilimListe'); krBox.innerHTML='';
        Object.keys(kirilim).sort((a,b)=>kirilim[b]-kirilim[a]).forEach(k => {
          let yuzde = (ftr+gdr)>0 ? Math.round((kirilim[k]/(ftr+gdr))*100) : 0;
          krBox.innerHTML += `<div class="space-y-1"><div class="flex justify-between text-zinc-300 font-bold"><span>${k} (%${yuzde})</span><span>₺${kirilim[k].toLocaleString('tr-TR')}</span></div><div class="w-full bg-zinc-800 h-1.5 rounded-full"><div class="bg-indigo-500 h-full rounded-full" style="width:${yuzde}%"></div></div></div>`;
        });

        // ALIŞVERİŞ 
        const aBox = document.getElementById('alisverisListe'); aBox.innerHTML='';
        (appVerisi.alisveris || []).forEach((i, idx) => {
          const durum = i[4] || 'Bekliyor';
          const isAlindi = durum === 'Alındı';
          aBox.innerHTML+=`
          <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button onclick="alisverisDurumDegistir(${idx}, '${durum}')" class="w-6 h-6 rounded-full border ${isAlindi ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'border-zinc-600 text-zinc-600'} flex items-center justify-center transition-colors">
                <i class="fa-solid fa-check text-xs"></i>
              </button>
              <div>
                <p class="font-bold text-sm ${isAlindi ? 'line-through text-zinc-500' : 'text-zinc-200'}">${i[0]||''}</p>
                <p class="text-[11px] text-zinc-500">${i[1]||1} Adet • ${i[2]||''}</p>
              </div>
            </div>
            <button onclick="alisverisSil(${idx})" class="p-2 text-rose-500/70 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>
          </div>`;
        });
        
        // İSTEKLER 
        const iBox = document.getElementById('istekListe'); iBox.innerHTML='';
        (appVerisi.istekler || []).forEach((i, idx) => {
          iBox.innerHTML+=`
          <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex justify-between items-center">
            <div class="flex gap-3 overflow-hidden">
              <div class="w-12 h-12 bg-zinc-800 rounded-xl flex items-center justify-center text-zinc-500 shrink-0"><i class="fa-solid fa-gift"></i></div>
              <div class="overflow-hidden">
                <p class="font-bold text-sm truncate">${i[1]||''}</p>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-[11px] text-zinc-500">${i[3]||''}</span>
                  ${i[0]?`<a href="${i[0]}" target="_blank" class="text-[10px] text-indigo-400 font-bold underline">Linke Git</a>`:''}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-3 pl-2">
              <p class="font-black text-sm text-zinc-200">₺${Number(i[2]||0).toLocaleString('tr-TR')}</p>
              <button onclick="istekSil(${idx})" class="text-rose-500/70 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>`;
        });
      } catch (e) {}
    }

    function kameraAc() {
      document.getElementById('kameraKutusu').classList.remove('hidden');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
        document.getElementById('f_barkod').value = txt; kameraKapat(); barkodlaUrunAra(txt);
      }, ()=>{}).catch(()=>alert("Kamera izni gerekli."));
    }
    function kameraKapat() { 
      try { if(html5QrCode){html5QrCode.stop(); html5QrCode.clear();} } catch(e){}
      document.getElementById('kameraKutusu').classList.add('hidden'); 
    }
  </script>
</body>
</html>
