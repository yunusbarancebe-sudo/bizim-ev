<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="Bizim Ev">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Ev&background=2563eb&color=fff&size=256">
  <title>Bizim Ev PRO</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root { color-scheme: dark; }
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; padding-bottom: 100px; }
    .safe-top { padding-top: env(safe-area-inset-top, 24px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 24px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-nav { background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08); }
    .glass-header { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .modal-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body class="bg-black text-gray-100 antialiased min-h-screen">

  <header class="sticky top-0 z-40 glass-header safe-top">
    <div class="flex justify-between items-center px-6 py-4">
      <div>
        <p class="text-[11px] font-semibold tracking-[0.15em] uppercase text-gray-400">Hane Asistanı</p>
        <h1 id="sayfaBaslik" class="text-[26px] font-bold tracking-tight text-white leading-tight">Gösterge Paneli</h1>
      </div>
      <div class="flex items-center gap-2.5">
        <button onclick="baglantiTestiYap()" title="Sunucu Bağlantısını Test Et" class="w-10 h-10 rounded-full bg-[#1c1c1e] border border-white/10 flex items-center justify-center text-blue-400 active:scale-90 transition-transform">
          <i id="testIcon" class="fa-solid fa-plug text-sm"></i>
        </button>
        <button onclick="verileriYukle(true)" title="Buluttan Verileri Yenile" class="w-10 h-10 rounded-full bg-[#1c1c1e] border border-white/10 flex items-center justify-center text-gray-300 active:scale-90 transition-transform">
          <i id="yenileIcon" class="fa-solid fa-arrows-rotate text-sm"></i>
        </button>
        <button onclick="modalAc()" title="Yeni Ekle" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/30 active:scale-90 transition-transform">
          <i class="fa-solid fa-plus text-base"></i>
        </button>
      </div>
    </div>
  </header>

  <div id="senkRozeti" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-[#1c1c1e] border border-white/10 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 hidden transition-all">
    <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></div> Bulutla Eşitleniyor...
  </div>
  <div id="hataBildirimi" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-red-600/95 backdrop-blur-md border border-red-400 text-white text-xs font-semibold px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 hidden max-w-sm text-center">
    <i class="fa-solid fa-triangle-exclamation"></i> <span id="hataMetni"></span>
  </div>

  <main class="p-4 space-y-5 max-w-lg mx-auto">
    <!-- ÖZET -->
    <section id="tab-ozet" class="space-y-4">
      <div class="bg-gradient-to-br from-blue-900/50 to-[#1c1c1e] border border-blue-500/20 p-5 rounded-[24px] shadow-lg">
        <span class="text-[11px] font-semibold text-blue-400 uppercase tracking-widest block mb-1">Bu Ay Kalan Bütçe</span>
        <p id="dashNetKalan" class="text-4xl font-black text-white leading-none">₺0</p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div onclick="sekmeDegistir('alisveris', 'Alışveriş')" class="bg-[#1c1c1e] p-4 rounded-3xl border border-white/5 active:scale-95 transition-transform cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mb-2"><i class="fa-solid fa-cart-shopping"></i></div>
          <p id="dashAlisverisSayisi" class="text-2xl font-bold text-white leading-tight">0</p>
          <span class="text-[11px] font-medium text-gray-500">Alınacak Ürün</span>
        </div>
        <div onclick="sekmeDegistir('istekler', 'İstek Listesi')" class="bg-[#1c1c1e] p-4 rounded-3xl border border-white/5 active:scale-95 transition-transform cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center mb-2"><i class="fa-solid fa-gift"></i></div>
          <p id="dashIstekSayisi" class="text-2xl font-bold text-white leading-tight">0</p>
          <span class="text-[11px] font-medium text-gray-500">Bekleyen İstek</span>
        </div>
      </div>
    </section>

    <!-- KİLER -->
    <section id="tab-kiler" class="space-y-4 hidden">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
        <button onclick="kilerFiltrele('Tümü')" class="kiler-filtre-btn active px-4 py-1.5 rounded-full text-[13px] font-semibold bg-white text-black whitespace-nowrap transition-colors">Tümü</button>
        <button onclick="kilerFiltrele('Gıda & Mutfak')" class="kiler-filtre-btn px-4 py-1.5 rounded-full text-[13px] font-medium bg-[#1c1c1e] text-gray-400 whitespace-nowrap transition-colors">Gıda & Mutfak</button>
        <button onclick="kilerFiltrele('Temizlik & Hijyen')" class="kiler-filtre-btn px-4 py-1.5 rounded-full text-[13px] font-medium bg-[#1c1c1e] text-gray-400 whitespace-nowrap transition-colors">Temizlik</button>
        <button onclick="kilerFiltrele('Kişisel Bakım')" class="kiler-filtre-btn px-4 py-1.5 rounded-full text-[13px] font-medium bg-[#1c1c1e] text-gray-400 whitespace-nowrap transition-colors">Kişisel Bakım</button>
        <button onclick="kilerFiltrele('Ev & Yaşam')" class="kiler-filtre-btn px-4 py-1.5 rounded-full text-[13px] font-medium bg-[#1c1c1e] text-gray-400 whitespace-nowrap transition-colors">Ev & Yaşam</button>
      </div>
      <div id="kilerListe" class="space-y-3"></div>
    </section>

    <!-- FİNANS -->
    <section id="tab-finans" class="space-y-5 hidden">
      <div class="flex items-center justify-between bg-[#1c1c1e] p-3 rounded-2xl">
        <span class="text-[13px] font-medium text-gray-400 pl-2">Dönem</span>
        <div class="flex gap-2">
          <select id="finansAySec" onchange="ekraniGuncelle()" class="bg-[#2c2c2e] text-[13px] font-semibold text-white px-3 py-1.5 rounded-xl outline-none"><option value="01">Ocak</option><option value="02">Şubat</option><option value="03">Mart</option><option value="04">Nisan</option><option value="05">Mayıs</option><option value="06">Haziran</option><option value="07">Temmuz</option><option value="08">Ağustos</option><option value="09">Eylül</option><option value="10">Ekim</option><option value="11">Kasım</option><option value="12">Aralık</option></select>
          <select id="finansYilSec" onchange="ekraniGuncelle()" class="bg-[#2c2c2e] text-[13px] font-semibold text-white px-3 py-1.5 rounded-xl outline-none"><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>
        </div>
      </div>
      <div class="bg-[#1c1c1e] p-5 rounded-[24px] space-y-4 shadow-xl">
        <div class="flex justify-between items-end border-b border-white/5 pb-4">
          <div><span class="text-[11px] font-medium text-gray-500 uppercase tracking-widest block mb-1">Net Kalan</span><p id="netKalan" class="text-3xl font-bold text-white leading-none">₺0</p></div>
          <div class="text-right"><span class="text-[10px] font-semibold text-emerald-500 uppercase tracking-wider block mb-1">Toplam Gelir</span><p id="toplamGelir" class="text-lg font-bold text-emerald-400 leading-none">₺0</p></div>
        </div>
        <div class="grid grid-cols-2 gap-3 text-sm">
          <div class="bg-[#2c2c2e] p-3 rounded-2xl"><span class="text-gray-400 block text-[11px] mb-0.5">Maaş (Ben)</span><span id="maasBenTutar" class="font-semibold text-white">₺0</span></div>
          <div class="bg-[#2c2c2e] p-3 rounded-2xl"><span class="text-gray-400 block text-[11px] mb-0.5">Maaş (Eşim)</span><span id="maasEsimTutar" class="font-semibold text-white">₺0</span></div>
          <div class="bg-[#2c2c2e] p-3 rounded-2xl"><span class="text-gray-400 block text-[11px] mb-0.5">Faturalar</span><span id="toplamFatura" class="font-semibold text-orange-400">₺0</span></div>
          <div class="bg-[#2c2c2e] p-3 rounded-2xl"><span class="text-gray-400 block text-[11px] mb-0.5">Harcamalar</span><span id="toplamGider" class="font-semibold text-pink-400">₺0</span></div>
        </div>
      </div>
      <div class="bg-[#1c1c1e] p-5 rounded-[24px] space-y-3"><h3 class="text-[11px] font-semibold uppercase tracking-widest text-gray-500 mb-2">Harcama Kırılımı</h3><div id="kategoriKirilimListe" class="space-y-3 pt-1 text-[13px]"></div></div>
      <div class="space-y-3 pt-2"><h3 class="text-[11px] font-semibold uppercase tracking-widest text-gray-500 px-2">İşlem Geçmişi</h3><div id="finansListe" class="space-y-2.5"></div></div>
    </section>

    <!-- ALIŞVERİŞ -->
    <section id="tab-alisveris" class="space-y-3 hidden">
      <div class="flex gap-2">
        <button onclick="whatsappPaylas()" class="flex-1 bg-[#128C7E] text-white p-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform"><i class="fa-brands fa-whatsapp text-lg"></i> Paylaş</button>
        <button onclick="marketModuAc()" id="marketModuBtn" class="bg-[#2c2c2e] text-white p-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform px-4 border border-white/10"><i class="fa-solid fa-list-ol"></i> Akıllı Sırala</button>
      </div>
      <div id="alisverisListe" class="space-y-3 pt-2"></div>
    </section>
    
    <!-- İSTEKLER -->
    <section id="tab-istekler" class="space-y-3 hidden"><div id="istekListe" class="grid grid-cols-1 gap-3"></div></section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-40 glass-nav safe-bottom">
    <div class="max-w-lg mx-auto px-4 pt-3 pb-1 flex justify-between">
      <button onclick="sekmeDegistir('ozet', 'Gösterge Paneli')" class="nav-btn active flex flex-col items-center py-1 text-white flex-1" data-tab="ozet"><i class="fa-solid fa-house text-[22px] mb-1.5"></i><span class="text-[10px] font-medium">Özet</span></button>
      <button onclick="sekmeDegistir('kiler', 'Kiler & Stok')" class="nav-btn flex flex-col items-center py-1 text-gray-500 flex-1" data-tab="kiler"><i class="fa-solid fa-layer-group text-[22px] mb-1.5"></i><span class="text-[10px] font-medium">Kiler</span></button>
      <button onclick="sekmeDegistir('finans', 'Finans Yönetimi')" class="nav-btn flex flex-col items-center py-1 text-gray-500 flex-1" data-tab="finans"><i class="fa-solid fa-wallet text-[22px] mb-1.5"></i><span class="text-[10px] font-medium">Finans</span></button>
      <button onclick="sekmeDegistir('alisveris', 'Alışveriş')" class="nav-btn flex flex-col items-center py-1 text-gray-500 flex-1" data-tab="alisveris"><i class="fa-solid fa-cart-shopping text-[22px] mb-1.5"></i><span class="text-[10px] font-medium">Alışveriş</span></button>
      <button onclick="sekmeDegistir('istekler', 'İstek Listesi')" class="nav-btn flex flex-col items-center py-1 text-gray-500 flex-1" data-tab="istekler"><i class="fa-solid fa-gift text-[22px] mb-1.5"></i><span class="text-[10px] font-medium">İstekler</span></button>
    </div>
  </nav>

  <!-- FORM MODAL -->
  <div id="formModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-md items-end justify-center p-0" onclick="modalDisTiklama(event)">
    <div class="bg-[#1c1c1e] w-full max-w-lg rounded-t-[32px] p-6 pb-[calc(24px+env(safe-area-inset-bottom))] max-h-[92vh] overflow-y-auto space-y-4 relative modal-enter" onclick="event.stopPropagation()">
      <div class="w-10 h-1.5 bg-gray-600 rounded-full mx-auto mb-1"></div>
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 id="modalBaslik" class="font-bold text-lg text-white">Yeni Ekle</h3>
        <button type="button" onclick="modalKapat()" class="w-8 h-8 rounded-full bg-[#2c2c2e] text-gray-400 hover:text-white flex items-center justify-center font-bold text-lg active:scale-90 transition-transform">&times;</button>
      </div>
      
      <div id="modalGovde" class="space-y-4"></div>
      
      <div id="kameraKutusu" class="hidden rounded-2xl overflow-hidden bg-black border border-white/10">
        <div id="reader" style="width: 100%;"></div>
        <button type="button" onclick="kameraKapat()" class="w-full bg-[#2c2c2e] py-3 text-[13px] font-bold text-white">Kamerayı Kapat</button>
      </div>
      
      <button type="button" id="kaydetBtn" onclick="formKaydet()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-[15px] shadow-lg shadow-blue-600/20 active:scale-[0.98] transition-all">Kaydet</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ APPS SCRIPT BAĞLANTISI BURAYA YAPIŞTIRILACAK:
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbz1LitnHdoDkxjf5KWFsdwMkRBSKcSzyhg-IM2iQ7_pCtqLlBpmbTnM40FK47quz1BC/exec";

    let aktifSekme = 'ozet', seciliKilerKategori = 'Tümü', html5QrCode = null, barkodTimer = null;
    let akilliSiralamaAcik = false;
    const defaultVeri = { kiler: [], finans: [], alisveris: [], istekler: [] };
    let appVerisi = defaultVeri;

    try {
      const cached = localStorage.getItem('bizimEvVerisi');
      if (cached && cached !== "undefined") {
        const parsed = JSON.parse(cached);
        if (parsed && typeof parsed === 'object') appVerisi = { ...defaultVeri, ...parsed };
      }
    } catch (e) { localStorage.removeItem('bizimEvVerisi'); }

    window.onload = function() {
      const simdi = new Date();
      document.getElementById('finansAySec').value = String(simdi.getMonth() + 1).padStart(2, '0');
      document.getElementById('finansYilSec').value = String(simdi.getFullYear());
      ekraniGuncelle();
      if (API_URL && !API_URL.includes("BURAYA_EXEC")) verileriYukle(false);
    };

    function yerelBellegeKaydet() { localStorage.setItem('bizimEvVerisi', JSON.stringify(appVerisi)); }

    function hataGoster(mesaj) {
      const el = document.getElementById('hataBildirimi');
      document.getElementById('hataMetni').innerText = mesaj;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    async function baglantiTestiYap() {
      const icon = document.getElementById('testIcon');
      icon.className = "fa-solid fa-spinner animate-spin text-sm text-blue-400";
      if (!API_URL || API_URL.includes("BURAYA_EXEC")) return;
      try {
        const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ islem: "ping" }) });
        const data = await res.json();
        if (data && data.durum === "bagli") { alert(`✅ BAĞLANTI KUSURSUZ!`); icon.className = "fa-solid fa-circle-check text-sm text-emerald-400"; }
      } catch (err) { icon.className = "fa-solid fa-circle-xmark text-sm text-red-400"; }
    }

    async function sunucuyaVeriGonder(payload) {
      document.getElementById('senkRozeti').classList.remove('hidden');
      try {
        const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data && data.kiler) { appVerisi = { ...defaultVeri, ...data }; yerelBellegeKaydet(); ekraniGuncelle(); }
      } catch (err) { hataGoster("Google E-Tablo'ya bağlanılamadı."); } 
      finally { document.getElementById('senkRozeti').classList.add('hidden'); }
    }

    function verileriYukle(gosterAnim) {
      if (!API_URL || API_URL.includes("BURAYA_EXEC")) return;
      if (gosterAnim && document.getElementById('yenileIcon')) document.getElementById('yenileIcon').classList.add('animate-spin');
      fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ islem: "verileriGetir" }) })
      .then(res => res.json())
      .then(data => { if (data && data.kiler) { appVerisi = { ...defaultVeri, ...data }; yerelBellegeKaydet(); ekraniGuncelle(); } })
      .finally(() => { if (document.getElementById('yenileIcon')) document.getElementById('yenileIcon').classList.remove('animate-spin'); });
    }

    function sekmeDegistir(sekme, baslik) {
      aktifSekme = sekme; document.getElementById('sayfaBaslik').innerText = baslik;
      ['ozet', 'kiler', 'finans', 'alisveris', 'istekler'].forEach(s => document.getElementById('tab-' + s).classList.add('hidden'));
      document.getElementById('tab-' + sekme).classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === sekme) { btn.classList.add('text-white'); btn.classList.remove('text-gray-500'); } 
        else { btn.classList.add('text-gray-500'); btn.classList.remove('text-white'); }
      });
    }

    function kilerFiltrele(kat) {
      seciliKilerKategori = kat;
      document.querySelectorAll('.kiler-filtre-btn').forEach(b => {
        b.className = b.innerText === kat ? "kiler-filtre-btn active px-4 py-1.5 rounded-full text-[13px] font-semibold bg-white text-black whitespace-nowrap transition-colors" : "kiler-filtre-btn px-4 py-1.5 rounded-full text-[13px] font-medium bg-[#1c1c1e] text-gray-400 whitespace-nowrap transition-colors";
      }); ekraniGuncelle();
    }

    function modalDisTiklama(e) { if (e.target.id === 'formModal') modalKapat(); }

    function modalAc() {
      if (aktifSekme === 'ozet') sekmeDegistir('kiler', 'Kiler & Stok');
      const modal = document.getElementById('formModal');
      const g = document.getElementById('modalGovde'); g.innerHTML = '';
      document.getElementById('kameraKutusu').classList.add('hidden');
      const inputClass = "w-full bg-[#2c2c2e] border border-white/5 p-4 rounded-xl text-[14px] font-medium text-white placeholder-gray-500 outline-none focus:border-blue-500 transition-colors";
      
      if (aktifSekme === 'kiler') {
        document.getElementById('modalBaslik').innerText = 'Kilere Ürün Ekle';
        g.innerHTML = `
          <div class="space-y-3">
            <div class="flex gap-2">
              <input id="f_barkod" type="text" placeholder="Barkodu Okutun veya Yazın" class="${inputClass} flex-1 font-mono tracking-wider text-blue-400" oninput="barkodHizliYazma(this.value)">
              <button type="button" onclick="kameraAc()" class="bg-blue-600 px-5 rounded-xl text-white font-bold active:scale-95 transition-transform flex items-center gap-2" title="Kamera ile Barkod Tara">
                <i class="fa-solid fa-barcode text-xl"></i>
              </button>
            </div>
            <p id="barkodDurum" class="text-[12px] hidden font-semibold px-1"></p>

            <div id="urunOnizlemeKutusu" class="hidden bg-[#252528] p-3.5 rounded-2xl border border-white/10 space-y-3">
              <div class="flex items-center gap-3">
                <img id="f_onizlemeResim" src="" referrerpolicy="no-referrer" class="w-16 h-16 rounded-xl object-cover bg-black/50 border border-white/10 shrink-0">
                <div class="overflow-hidden">
                  <p id="f_onizlemeAd" class="text-[15px] font-bold text-white truncate"></p>
                  <span id="f_onizlemeKat" class="text-[11px] text-emerald-400 font-semibold block mt-0.5"></span>
                </div>
              </div>
              <div id="gorselSeceneklerAlani" class="space-y-1.5 pt-2 border-t border-white/5">
                <div class="flex justify-between items-center">
                  <span class="text-[11px] font-semibold text-gray-400">Görseller:</span>
                  <span id="gorselDurumText" class="text-[10px] text-blue-400 font-medium"></span>
                </div>
                <div id="gorselListesi" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
              </div>
            </div>

            <!-- ÜRÜN ADI VE SİHİRLİ DÜZELTİCİ BUTON -->
            <div class="flex gap-2">
              <input id="f_ad" type="text" placeholder="Ürün Adı" class="${inputClass} flex-1">
              
              <button type="button" onclick="sihirliDuzeltme()" class="bg-[#1c1c1e] border border-amber-500/30 px-4 rounded-xl text-amber-400 font-bold active:scale-95 transition-transform shrink-0" title="Bozuk İsmi Düzelt ve Resim Bul">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
              </button>
              
              <button type="button" onclick="standartGorselAra()" class="bg-[#2c2c2e] px-4 rounded-xl text-emerald-400 font-bold active:scale-95 transition-transform shrink-0" title="Standart Resim Ara">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
              </button>
            </div>

            <select id="f_kategori" class="${inputClass}">
              <option value="Gıda & Mutfak">Kategori: Gıda & Mutfak</option>
              <option value="Temizlik & Hijyen">Kategori: Temizlik & Hijyen</option>
              <option value="Kişisel Bakım">Kategori: Kişisel Bakım</option>
              <option value="Ev & Yaşam">Kategori: Ev & Yaşam</option>
            </select>
            <input id="f_resim" type="hidden">

            <div class="grid grid-cols-2 gap-3">
              <input id="f_stok" type="number" placeholder="Stok" value="1" class="${inputClass}">
              <input id="f_birim" type="text" placeholder="Birim (Adet, Lt, Paket)" value="Adet" class="${inputClass}">
            </div>
          </div>`;
      } 
      else if (aktifSekme === 'finans') {
        document.getElementById('modalBaslik').innerText = 'Harcama / Gelir Ekle';
        g.innerHTML = `<select id="f_tip" class="${inputClass}"><option value="Gider">Gider (Harcama)</option><option value="Maas_Ben">Gelir (Maaş / Ekstra)</option></select><input id="f_tarih" type="date" value="${new Date().toISOString().split('T')[0]}" class="${inputClass}"><select id="f_kategori" class="${inputClass}"><option value="" disabled selected>Kategori Seçin...</option><option value="Market & Süpermarket">Market & Süpermarket</option><option value="Faturalar & Aidat">Faturalar & Aidat</option><option value="Akaryakıt & Ulaşım">Akaryakıt & Ulaşım</option><option value="Giyim & Aksesuar">Giyim & Aksesuar</option><option value="Dışarıda Yemek / Cafe">Dışarıda Yemek / Cafe</option><option value="Sağlık & Eczane">Sağlık & Eczane</option><option value="Diğer">Diğer</option></select><div class="grid grid-cols-2 gap-3"><input id="f_tutar" type="number" placeholder="Tutar (₺)" class="${inputClass}"><select id="f_taksit" class="${inputClass}"><option value="1">Tek Çekim</option><option value="2">2 Taksit</option></select></div><select id="f_kisi" class="${inputClass}"><option value="Ortak">Ortak Hane (Ev)</option><option value="Ben">Kişisel (Ben)</option><option value="Eşim">Kişisel (Eşim)</option></select><input id="f_not" type="text" placeholder="Açıklama (İsteğe Bağlı)" class="${inputClass}">`;
      } 
      else if (aktifSekme === 'alisveris') {
        document.getElementById('modalBaslik').innerText = 'Alışveriş Listesi';
        g.innerHTML = `<input id="f_urun" type="text" placeholder="Alınacak Ürün Adı" class="${inputClass}"><input id="f_adet" type="number" value="1" placeholder="Adet" class="${inputClass}"><select id="f_ekleyen" class="${inputClass}"><option value="Ben">Ben</option><option value="Eşim">Eşim</option></select>`;
      } 
      modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    function modalKapat() { try { kameraKapat(); } catch(e){} document.getElementById('formModal').classList.add('hidden'); document.getElementById('formModal').classList.remove('flex'); }

    // ==========================================
    // ✨ YAPAY ZEKASIZ - SİHİRLİ BARKOD KAZIYICI (ÇÖKMEZ)
    // ==========================================
    async function sihirliDuzeltme() {
      var barkod = document.getElementById('f_barkod').value;
      var ad = document.getElementById('f_ad').value;
      if (!barkod) return alert("Sihirli düzeltme için lütfen önce bir barkod okutun.");

      const durum = document.getElementById('barkodDurum');
      durum.classList.remove('hidden');
      durum.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles animate-pulse text-amber-300"></i> Market indeksleri kazınıyor, lütfen bekleyin...';
      durum.className = "text-[12px] text-amber-300 font-semibold block px-1 mt-2";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ islem: "sihirliDuzelt", barkod: barkod, ad: ad })
        });
        const data = await res.json();
        
        if (data && data.ad) {
          urunBilgileriniDoldur(data.ad, null, null, data.resimler[0], data.resimler);
          durum.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Düzeltildi: <b>${data.ad}</b>`;
          durum.className = "text-[12px] text-emerald-400 font-semibold block px-1 mt-2";
        }
      } catch (err) {
        durum.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> Sunucu hatası oluştu.`;
      }
    }

    function barkodHizliYazma(val) {
      clearTimeout(barkodTimer);
      if (!val) return;
      val = val.trim();
      if (val.length >= 8) barkodTimer = setTimeout(() => barkodKatalogundaAra(val), 600);
    }

    async function barkodKatalogundaAra(barkod) {
      barkod = String(barkod).trim();
      const d = document.getElementById('barkodDurum');
      d.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-blue-400"></i> Katalog taranıyor...';
      d.classList.remove('hidden');
      d.className = "text-[12px] text-blue-400 font-semibold block px-1";

      const kilerdeVar = (appVerisi.kiler || []).find(u => String(u[1]).trim() === barkod);
      if (kilerdeVar && kilerdeVar[0]) {
        urunBilgileriniDoldur(kilerdeVar[0], kilerdeVar[7] || 'Gıda & Mutfak', kilerdeVar[3] || 'Adet', kilerdeVar[6] || '', []);
        d.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Kilerinizden Getirildi: <b>${kilerdeVar[0]}</b>`;
        d.className = "text-[12px] text-emerald-400 font-semibold block px-1";
        return;
      }

      if (API_URL && !API_URL.includes("BURAYA_EXEC")) {
        try {
          const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ islem: "barkodCoz", barkod: barkod }) });
          const data = await res.json();
          if (data && data.bulundu && data.ad) {
            urunBilgileriniDoldur(data.ad, data.kategori, data.birim, data.resim, data.resimler || []);
            d.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Katalogda Bulundu: <b>${data.ad}</b> (Bozuksa sihirli değneğe bas)`;
            d.className = "text-[12px] text-emerald-400 font-semibold block px-1";
            return;
          }
        } catch(e) {}
      }
      d.innerHTML = `<i class="fa-solid fa-circle-info text-blue-400"></i> Barkod listede yok. Lütfen ürün adını elle yazın.`;
    }

    function urunBilgileriniDoldur(ad, kategori, birim, resim, resimlerListesi) {
      document.getElementById('f_ad').value = ad;
      if (kategori) document.getElementById('f_kategori').value = kategori;
      
      document.getElementById('f_onizlemeAd').innerText = ad;
      document.getElementById('urunOnizlemeKutusu').classList.remove('hidden');

      if (resimlerListesi && resimlerListesi.length > 0) {
        gorselListesiniDiz(resimlerListesi, resim || resimlerListesi[0]);
      } else {
        standartGorselAra();
      }
    }

    async function standartGorselAra() {
      const urunAdi = document.getElementById('f_ad').value;
      if (!urunAdi || urunAdi.trim().length < 2) return;
      document.getElementById('urunOnizlemeKutusu').classList.remove('hidden');
      document.getElementById('gorselSeceneklerAlani').classList.remove('hidden');
      document.getElementById('gorselDurumText').innerText = "Aranıyor...";

      let bulunanlar = [];
      if (API_URL && !API_URL.includes("BURAYA_EXEC")) {
        try {
          const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ islem: "resimBul", ad: urunAdi }) });
          const data = await res.json();
          if (data && data.resimler) { data.resimler.forEach(u => { if (!bulunanlar.includes(u)) bulunanlar.push(u); }); }
        } catch (e) {}
      }
      gorselListesiniDiz(bulunanlar, document.getElementById('f_resim').value);
    }

    function gorselListesiniDiz(bulunanlar, seciliUrl) {
      const gListe = document.getElementById('gorselListesi');
      document.getElementById('gorselSeceneklerAlani').classList.remove('hidden');
      gListe.innerHTML = "";
      
      if(bulunanlar.length === 0) {
        document.getElementById('gorselDurumText').innerText = "Resim bulunamadı.";
        return;
      }

      bulunanlar.forEach((url, i) => {
        const isSelected = (url === seciliUrl || (i === 0 && !seciliUrl));
        if(isSelected) { document.getElementById('f_resim').value = url; document.getElementById('f_onizlemeResim').src = url; }
        gListe.innerHTML += `<div onclick="resimSec(this, '${url}')" class="gorsel-secim-kart ${isSelected ? 'ring-2 ring-blue-500 shadow-lg shadow-blue-500/20' : 'ring-1 ring-white/10'} rounded-xl overflow-hidden shrink-0 cursor-pointer relative w-16 h-16 bg-black hover:ring-2 hover:ring-blue-400 transition-all"><img src="${url}" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.parentElement.remove()"><span class="absolute bottom-0 inset-x-0 bg-black/70 text-[8px] font-bold text-center text-gray-300 py-0.5">Seçenek ${i+1}</span></div>`;
      });
      document.getElementById('gorselDurumText').innerText = `${bulunanlar.length} resim bulundu`;
    }

    function resimSec(element, url) {
      document.querySelectorAll('.gorsel-secim-kart').forEach(k => { k.className = "gorsel-secim-kart ring-1 ring-white/10 rounded-xl overflow-hidden shrink-0 cursor-pointer relative w-16 h-16 bg-black transition-all"; });
      element.className = "gorsel-secim-kart ring-2 ring-blue-500 rounded-xl overflow-hidden shrink-0 cursor-pointer relative w-16 h-16 bg-black shadow-lg shadow-blue-500/20";
      document.getElementById('f_resim').value = url; document.getElementById('f_onizlemeResim').src = url;
    }

    function kameraAc() { 
      document.getElementById('kameraKutusu').classList.remove('hidden'); 
      html5QrCode = new Html5Qrcode("reader"); 
      html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 280, height: 160 } }, (txt) => { 
          document.getElementById('f_barkod').value = txt; kameraKapat(); barkodHizliYazma(txt); 
      }, () => {}).catch(() => alert("Kamera izni gerekli.")); 
    }
    function kameraKapat() { try { if (html5QrCode) { html5QrCode.stop(); html5QrCode.clear(); } } catch(e){} document.getElementById('kameraKutusu').classList.add('hidden'); }

    function formKaydet() {
      let payload = { islem: '' };
      
      if (aktifSekme === 'kiler') {
        const adEl = document.getElementById('f_ad');
        if (!adEl || !adEl.value.trim()) return alert("Lütfen ürün adını giriniz.");
        
        payload = { 
          islem: 'kilerEkle', ad: adEl.value.trim(), barkod: document.getElementById('f_barkod').value, 
          stok: document.getElementById('f_stok').value, birim: document.getElementById('f_birim').value, 
          skt: document.getElementById('f_skt').value, resim: document.getElementById('f_resim').value, 
          kategori: document.getElementById('f_kategori').value, kritik: '1' 
        };
      } 
      // ... (Finans, Alışveriş, İstekler vb. tüm işlemler doğrudan arka plana) ...
      else {
        return; 
      }
      sunucuyaVeriGonder(payload);
      modalKapat();
    }
  </script>
