<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bizim Ev</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      padding-bottom: 100px;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 24px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 antialiased min-h-screen">

  <!-- iOS Üst Navigasyon -->
  <header class="sticky top-0 z-40 bg-[#09090b]/80 backdrop-blur-xl border-b border-zinc-800/80 safe-top">
    <div class="flex justify-between items-center px-5 py-3">
      <div>
        <p class="text-[10px] font-bold tracking-widest uppercase text-zinc-500">Hane Asistanı</p>
        <h1 id="sayfaBaslik" class="text-2xl font-extrabold tracking-tight text-white">Kiler & Stok</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="verileriYukle()" class="w-9 h-9 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 active:scale-95">
          <i id="yenileIcon" class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
        <button onclick="modalAc()" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 active:scale-95">
          <i class="fa-solid fa-plus text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Yükleniyor Bildirimi -->
  <div id="yukleniyor" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-zinc-900 border border-zinc-800 px-5 py-3.5 rounded-2xl flex items-center gap-3">
      <div class="animate-spin rounded-full h-4 w-4 border-2 border-indigo-500 border-t-transparent"></div>
      <span class="text-xs font-semibold tracking-wide text-zinc-300">Senkronize Ediliyor...</span>
    </div>
  </div>

  <main class="p-4 space-y-4 max-w-lg mx-auto">

    <!-- 1. KİLER & STOK MODÜLÜ -->
    <section id="tab-kiler" class="space-y-3">
      <div id="sktUyariAlani"></div>
      <div id="kilerListe" class="space-y-2.5"></div>
    </section>

    <!-- 2. BÜTÇE & FATURALAR (BİRLEŞTİRİLMİŞ FİNANS) -->
    <section id="tab-finans" class="space-y-4 hidden">
      <!-- Maaş ve Net Durum Kartları -->
      <div class="bg-zinc-900/90 border border-zinc-800 p-4 rounded-3xl space-y-3">
        <div class="flex justify-between items-center border-b border-zinc-800/80 pb-3">
          <div>
            <span class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider">Net Kalan Bütçe</span>
            <p id="netKalan" class="text-2xl font-black text-white mt-0.5">₺0</p>
          </div>
          <div class="text-right">
            <span class="text-[10px] uppercase font-bold text-emerald-500 tracking-wider">Toplam Gelir</span>
            <p id="toplamGelir" class="text-sm font-bold text-emerald-400 mt-0.5">₺0</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-850">
            <span class="text-zinc-500 block text-[10px]">Maaş 1 (Ben)</span>
            <span id="maasBenTutar" class="font-bold text-zinc-200">₺0</span>
          </div>
          <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-850">
            <span class="text-zinc-500 block text-[10px]">Maaş 2 (Eşim)</span>
            <span id="maasEsimTutar" class="font-bold text-zinc-200">₺0</span>
          </div>
          <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-850">
            <span class="text-zinc-500 block text-[10px]">Faturalar & Aidat</span>
            <span id="toplamFatura" class="font-bold text-amber-400">₺0</span>
          </div>
          <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-850">
            <span class="text-zinc-500 block text-[10px]">Diğer Giderler</span>
            <span id="toplamGider" class="font-bold text-rose-400">₺0</span>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-500">Son İşlemler</h3>
          <span class="text-[10px] text-zinc-500">Maaş / Fatura / Harcama</span>
        </div>
        <div id="finansListe" class="space-y-2"></div>
      </div>
    </section>

    <!-- 3. ALIŞVERİŞ LİSTESİ -->
    <section id="tab-alisveris" class="space-y-3 hidden">
      <div id="alisverisListe" class="space-y-2"></div>
    </section>

    <!-- 4. İSTEK LİSTESİ (WISHLIST) -->
    <section id="tab-istekler" class="space-y-3 hidden">
      <div id="istekListe" class="space-y-2"></div>
    </section>

  </main>

  <!-- iOS Alt Gezinme Çubuğu (4 Sekme) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#09090b]/85 backdrop-blur-xl border-t border-zinc-850 safe-bottom">
    <div class="max-w-lg mx-auto px-6 py-2 flex justify-between">
      <button onclick="sekmeDegistir('kiler', 'Kiler & Stok')" class="nav-btn active flex flex-col items-center py-1 text-indigo-400" data-tab="kiler">
        <i class="fa-solid fa-boxes-stacked text-base mb-1"></i>
        <span class="text-[10px] font-medium">Kiler</span>
      </button>
      <button onclick="sekmeDegistir('finans', 'Bütçe & Faturalar')" class="nav-btn flex flex-col items-center py-1 text-zinc-500" data-tab="finans">
        <i class="fa-solid fa-wallet text-base mb-1"></i>
        <span class="text-[10px] font-medium">Finans</span>
      </button>
      <button onclick="sekmeDegistir('alisveris', 'Alışveriş')" class="nav-btn flex flex-col items-center py-1 text-zinc-500" data-tab="alisveris">
        <i class="fa-solid fa-basket-shopping text-base mb-1"></i>
        <span class="text-[10px] font-medium">Alışveriş</span>
      </button>
      <button onclick="sekmeDegistir('istekler', 'İstek Listesi')" class="nav-btn flex flex-col items-center py-1 text-zinc-500" data-tab="istekler">
        <i class="fa-solid fa-gift text-base mb-1"></i>
        <span class="text-[10px] font-medium">İstekler</span>
      </button>
    </div>
  </nav>

  <!-- Form Modalı -->
  <div id="formModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-t-[32px] sm:rounded-3xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto space-y-4 safe-bottom">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 id="modalBaslik" class="font-bold text-base text-zinc-100">Yeni Ekle</h3>
        <button onclick="modalKapat()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 flex items-center justify-center font-bold">&times;</button>
      </div>

      <div id="modalGovde" class="space-y-3"></div>

      <!-- Barkod Kamera Alanı -->
      <div id="kameraKutusu" class="hidden rounded-2xl overflow-hidden border border-zinc-800 bg-black">
        <div id="reader" style="width: 100%;"></div>
        <button onclick="kameraKapat()" class="w-full bg-zinc-800 py-2.5 text-xs font-semibold text-zinc-300">Kamerayı Kapat</button>
      </div>

      <button id="kaydetBtn" onclick="formKaydet()" class="w-full bg-indigo-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-indigo-600/30 active:scale-95 transition-all">
        Kaydet
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzLtLu55qtNDj8YWeZwRpma5EqmawcCtzZBFwwbcPl9kedk_ZCEOhxwJjsZDQ2mQxph/exec";

    let aktifSekme = 'kiler';
    let html5QrCode = null;

    let appVerisi = {
      kiler: [
        ["Süt", "8690504033215", "1", "Litre", "1", "2026-10-25", "https://images.openfoodfacts.org/images/products/869/050/403/3215/front_tr.3.200.jpg"],
        ["Yumurta", "8690000000001", "15", "Adet", "5", "2026-10-22", ""]
      ],
      finans: [
        ["2026-10-15", "Maas_Ben", "Maaş", "55000", "Ben", "Ekim Maaşı"],
        ["2026-10-15", "Maas_Esim", "Maaş", "48000", "Eşim", "Ekim Maaşı"],
        ["2026-10-20", "Fatura", "Aidat", "3200", "Ortak", "Ekim Aidatı + Ortak Isınma"],
        ["2026-10-21", "Fatura", "Elektrik", "750", "Ben", "Enerjisa"],
        ["2026-10-23", "Gider", "Market", "1450", "Eşim", "Haftalık Market"]
      ],
      alisveris: [["Zeytinyağı", "2", "Eşim", "2026-10-24"]],
      istekler: [["https://trendyol.com", "Airfryer", "4200", "Eşim"]]
    };

    window.onload = function() {
      if (API_URL && !API_URL.includes("BURAYA_EXEC")) {
        verileriYukle();
      } else {
        ekraniGuncelle();
      }
    };

    function verileriYukle() {
      if (!API_URL || API_URL.includes("BURAYA_EXEC")) return;
      yukleniyorGoster(true);
      document.getElementById('yenileIcon').classList.add('animate-spin');

      fetch(`${API_URL}?islem=verileriGetir`, { method: 'GET', redirect: 'follow' })
        .then(res => res.json())
        .then(data => {
          appVerisi = data;
          ekraniGuncelle();
        })
        .catch(err => console.error("Veri senkronizasyon hatası:", err))
        .finally(() => {
          yukleniyorGoster(false);
          document.getElementById('yenileIcon').classList.remove('animate-spin');
        });
    }

    function sekmeDegistir(sekme, baslik) {
      aktifSekme = sekme;
      document.getElementById('sayfaBaslik').innerText = baslik;
      ['kiler', 'finans', 'alisveris', 'istekler'].forEach(s => {
        document.getElementById('tab-' + s).classList.add('hidden');
      });
      document.getElementById('tab-' + sekme).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        if(btn.dataset.tab === sekme) {
          btn.classList.add('text-indigo-400');
          btn.classList.remove('text-zinc-500');
        } else {
          btn.classList.remove('text-indigo-400');
          btn.classList.add('text-zinc-500');
        }
      });
    }

    // SKT Fark Gün Hesaplama (Bugün baz alınır)
    function sktDurumHesapla(sktStr) {
      if (!sktStr) return null;
      const bugun = new Date();
      bugun.setHours(0,0,0,0);
      const parcalar = sktStr.split('-');
      if (parcalar.length !== 3) return null;
      const hedef = new Date(Number(parcalar[0]), Number(parcalar[1]) - 1, Number(parcalar[2]));
      return Math.ceil((hedef - bugun) / (1000 * 60 * 60 * 24));
    }

    function ekraniGuncelle() {
      // 1. KİLER VE SKT KONTROLÜ
      const kilerBox = document.getElementById('kilerListe');
      const sktBox = document.getElementById('sktUyariAlani');
      kilerBox.innerHTML = '';
      sktBox.innerHTML = '';

      let sktKritikListesi = [];

      (appVerisi.kiler || []).forEach(item => {
        const ad = item[0], barkod = item[1], stok = item[2], birim = item[3] || 'adet';
        const skt = item[5], resim = item[6];
        const farkGun = sktDurumHesapla(skt);

        let sktBadge = '';
        if (farkGun !== null) {
          if (farkGun < 0) {
            sktBadge = `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded-md text-[10px] font-bold">SKT Geçti (${Math.abs(farkGun)}g)</span>`;
            sktKritikListesi.push({ ad, msg: `${ad} ürününün tarihi ${Math.abs(farkGun)} gün önce geçti!`, tip: 'gecmiis' });
          } else if (farkGun <= 3) {
            sktBadge = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-md text-[10px] font-bold">Son ${farkGun === 0 ? 'Bugün' : farkGun + ' Gün'}</span>`;
            sktKritikListesi.push({ ad, msg: `${ad} için son ${farkGun === 0 ? 'bugün' : farkGun + ' gün'} kaldı!`, tip: 'yakin' });
          } else {
            sktBadge = `<span class="text-zinc-500 text-[10px]">SKT: ${skt}</span>`;
          }
        }

        const resimHTML = resim 
          ? `<img src="${resim}" class="w-12 h-12 object-cover rounded-xl bg-zinc-800 border border-zinc-700/50">`
          : `<div class="w-12 h-12 rounded-xl bg-zinc-800 border border-zinc-700/50 flex items-center justify-center text-zinc-500"><i class="fa-solid fa-box text-sm"></i></div>`;

        kilerBox.innerHTML += `
          <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
              ${resimHTML}
              <div>
                <p class="font-bold text-sm text-zinc-100">${ad}</p>
                <div class="flex items-center gap-2 mt-1">
                  ${sktBadge}
                  <span class="text-[11px] text-zinc-500">${barkod ? '#' + barkod : ''}</span>
                </div>
              </div>
            </div>
            <span class="px-3 py-1.5 rounded-xl bg-zinc-800 border border-zinc-700 text-xs font-extrabold text-zinc-200">
              ${stok} ${birim}
            </span>
          </div>`;
      });

      if (sktKritikListesi.length > 0) {
        sktBox.innerHTML = `
          <div class="bg-amber-500/10 border border-amber-500/30 p-3.5 rounded-2xl space-y-1.5">
            <div class="flex items-center gap-2 text-amber-400 text-xs font-bold uppercase tracking-wider">
              <i class="fa-solid fa-triangle-exclamation"></i> Tüketim & SKT Uyarısı
            </div>
            ${sktKritikListesi.map(u => `<p class="text-xs text-amber-200/90 font-medium">• ${u.msg}</p>`).join('')}
          </div>`;
      }

      // 2. FİNANS (2 MAAŞ, FATURALAR VE HARCAMALAR)
      let maasBen = 0, maasEsim = 0, toplamFatura = 0, digerGider = 0;
      const finansBox = document.getElementById('finansListe');
      finansBox.innerHTML = '';

      (appVerisi.finans || []).forEach(item => {
        const tip = item[1], tutar = Number(item[3]) || 0;
        if (tip === 'Maas_Ben') maasBen += tutar;
        else if (tip === 'Maas_Esim') maasEsim += tutar;
        else if (tip === 'Fatura') toplamFatura += tutar;
        else digerGider += tutar;

        const isGelir = tip.startsWith('Maas');
        const badgeColor = isGelir ? 'text-emerald-400' : (tip === 'Fatura' ? 'text-amber-400' : 'text-rose-400');
        const sign = isGelir ? '+' : '-';

        finansBox.innerHTML += `
          <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between">
            <div>
              <p class="font-bold text-sm text-zinc-200">${item[2]}</p>
              <p class="text-[11px] text-zinc-500">${item[0]} • ${item[4]} ${item[5] ? '• ' + item[5] : ''}</p>
            </div>
            <span class="font-black text-sm ${badgeColor}">
              ${sign}₺${tutar.toLocaleString('tr-TR')}
            </span>
          </div>`;
      });

      const toplamGelir = maasBen + maasEsim;
      const netKalan = toplamGelir - (toplamFatura + digerGider);

      document.getElementById('maasBenTutar').innerText = '₺' + maasBen.toLocaleString('tr-TR');
      document.getElementById('maasEsimTutar').innerText = '₺' + maasEsim.toLocaleString('tr-TR');
      document.getElementById('toplamFatura').innerText = '₺' + toplamFatura.toLocaleString('tr-TR');
      document.getElementById('toplamGider').innerText = '₺' + digerGider.toLocaleString('tr-TR');
      document.getElementById('toplamGelir').innerText = '₺' + toplamGelir.toLocaleString('tr-TR');
      document.getElementById('netKalan').innerText = '₺' + netKalan.toLocaleString('tr-TR');

      // 3. ALIŞVERİŞ
      const aliBox = document.getElementById('alisverisListe');
      aliBox.innerHTML = '';
      (appVerisi.alisveris || []).forEach((item, index) => {
        aliBox.innerHTML += `
          <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button onclick="alisverisTamamla(${index})" class="w-6 h-6 rounded-full border border-zinc-700 hover:border-emerald-500 hover:bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                <i class="fa-solid fa-check text-xs"></i>
              </button>
              <div>
                <p class="font-bold text-sm text-zinc-200">${item[0]}</p>
                <p class="text-[11px] text-zinc-500">${item[1]} adet • ${item[2]}</p>
              </div>
            </div>
          </div>`;
      });

      // 4. İSTEKLER
      const istBox = document.getElementById('istekListe');
      istBox.innerHTML = '';
      (appVerisi.istekler || []).forEach(item => {
        istBox.innerHTML += `
          <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between">
            <div>
              <p class="font-bold text-sm text-zinc-200">${item[1]}</p>
              <p class="text-[11px] text-zinc-500">${item[3]} istedi</p>
              ${item[0] ? `<a href="${item[0]}" target="_blank" class="text-xs text-indigo-400 underline mt-1 inline-block">Ürün Linki</a>` : ''}
            </div>
            <p class="font-extrabold text-sm text-zinc-200">₺${Number(item[2]).toLocaleString('tr-TR')}</p>
          </div>`;
      });
    }

    function modalAc() {
      const g = document.getElementById('modalGovde');
      g.innerHTML = '';
      document.getElementById('kameraKutusu').classList.add('hidden');

      if (aktifSekme === 'kiler') {
        document.getElementById('modalBaslik').innerText = 'Kilere Ürün Ekle';
        g.innerHTML = `
          <!-- Barkod Okuma ve Görsel Önizleme -->
          <div class="flex gap-2">
            <input id="f_barkod" type="text" placeholder="Barkod Numarası" class="flex-1 bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <button onclick="kameraAc()" class="bg-indigo-600 px-4 rounded-xl text-white active:scale-95"><i class="fa-solid fa-barcode"></i> Tara</button>
          </div>
          <p id="apiDurum" class="text-[11px] text-zinc-500 hidden"></p>

          <div id="urunOnizlemeKutusu" class="hidden flex items-center gap-3 bg-zinc-950 p-2.5 rounded-xl border border-zinc-800">
            <img id="f_onizlemeResim" src="" class="w-12 h-12 rounded-lg object-cover">
            <div>
              <p id="f_onizlemeAd" class="text-xs font-bold text-zinc-200"></p>
              <span class="text-[10px] text-emerald-400">Ürün veritabanından çekildi</span>
            </div>
          </div>

          <input id="f_ad" type="text" placeholder="Ürün Adı" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_resim" type="hidden">

          <div class="grid grid-cols-2 gap-2">
            <input id="f_stok" type="number" placeholder="Mevcut Stok" class="bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <input id="f_birim" type="text" placeholder="Birim (Adet, Paket, Lt)" class="bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          </div>

          <div>
            <label class="block text-[11px] text-zinc-400 mb-1 font-semibold">Son Kullanma Tarihi (SKT)</label>
            <input id="f_skt" type="date" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          </div>
          <input id="f_kritik" type="hidden" value="1">`;

        // Barkod elle yazılırsa da API'yi tetikle
        setTimeout(() => {
          document.getElementById('f_barkod').addEventListener('change', function() {
            barkodlaUrunAra(this.value.trim());
          });
        }, 100);

      } else if (aktifSekme === 'finans') {
        document.getElementById('modalBaslik').innerText = 'Gelir / Fatura / Gider Ekle';
        g.innerHTML = `
          <select id="f_tip" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Gider">Günlük Harcama (Gider)</option>
            <option value="Fatura">Fatura veya Aidat</option>
            <option value="Maas_Ben">Maaş (Ben)</option>
            <option value="Maas_Esim">Maaş (Eşim)</option>
          </select>
          <input id="f_kategori" type="text" placeholder="Kategori (Aidat, Market, Elektrik vb.)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_tutar" type="number" placeholder="Tutar (₺)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <select id="f_kisi" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Ben">Kişi: Ben</option>
            <option value="Eşim">Kişi: Eşim</option>
            <option value="Ortak">Ortak Hane</option>
          </select>
          <input id="f_not" type="text" placeholder="Açıklama (Örn: Ekim payölçer dahil)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">`;
      } else if (aktifSekme === 'alisveris') {
        document.getElementById('modalBaslik').innerText = 'Alınacak Ürün';
        g.innerHTML = `
          <input id="f_urun" type="text" placeholder="Alınacak Ürün Adı" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_adet" type="number" value="1" placeholder="Adet" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <select id="f_ekleyen" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Ben">Ekleyen: Ben</option>
            <option value="Eşim">Ekleyen: Eşim</option>
          </select>`;
      } else if (aktifSekme === 'istekler') {
        document.getElementById('modalBaslik').innerText = 'İstek / Wishlist Ekle';
        g.innerHTML = `
          <input id="f_link" type="text" placeholder="Ürün Linki (Trendyol, Amazon)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_ad" type="text" placeholder="Ürün Adı" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <input id="f_fiyat" type="number" placeholder="Fiyat (₺)" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
          <select id="f_ekleyen" class="w-full bg-zinc-800 border border-zinc-700/80 p-3.5 rounded-xl text-sm text-zinc-100 outline-none">
            <option value="Ben">Ekleyen: Ben</option>
            <option value="Eşim">Ekleyen: Eşim</option>
          </select>`;
      }
      document.getElementById('formModal').classList.remove('hidden');
    }

    function modalKapat() {
      kameraKapat();
      document.getElementById('formModal').classList.add('hidden');
    }

    // Open Food Facts API ile barkoddan ürün bilgisi ve görsel çekme
    async function barkodlaUrunAra(barkod) {
      if (!barkod) return;
      const apiDurum = document.getElementById('apiDurum');
      apiDurum.innerText = "Ürün aranıyor...";
      apiDurum.classList.remove('hidden');

      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barkod}.json`);
        const data = await res.json();

        if (data.status === 1 && data.product) {
          const p = data.product;
          const urunAdi = p.product_name_tr || p.product_name || p.generic_name || "";
          const resimUrl = p.image_front_small_url || p.image_front_url || p.image_url || "";

          if (urunAdi) document.getElementById('f_ad').value = urunAdi;
          if (resimUrl) {
            document.getElementById('f_resim').value = resimUrl;
            document.getElementById('f_onizlemeResim').src = resimUrl;
            document.getElementById('f_onizlemeAd').innerText = urunAdi;
            document.getElementById('urunOnizlemeKutusu').classList.remove('hidden');
          }
          apiDurum.innerText = "Ürün başarıyla bulundu!";
        } else {
          apiDurum.innerText = "Ürün bulunamadı, lütfen adı kendiniz yazın.";
        }
      } catch (err) {
        apiDurum.innerText = "Bağlantı hatası, ürün adı manuel girilebilir.";
      }
    }

    function formKaydet() {
      let params = new URLSearchParams();

      if (aktifSekme === 'kiler') {
        params.append('islem', 'kilerEkle');
        params.append('ad', document.getElementById('f_ad').value);
        params.append('barkod', document.getElementById('f_barkod').value);
        params.append('stok', document.getElementById('f_stok').value);
        params.append('birim', document.getElementById('f_birim').value);
        params.append('kritik', document.getElementById('f_kritik').value);
        params.append('skt', document.getElementById('f_skt').value);
        params.append('resim', document.getElementById('f_resim').value);
      } else if (aktifSekme === 'finans') {
        params.append('islem', 'finansEkle');
        params.append('tip', document.getElementById('f_tip').value);
        params.append('kategori', document.getElementById('f_kategori').value);
        params.append('tutar', document.getElementById('f_tutar').value);
        params.append('kisi', document.getElementById('f_kisi').value);
        params.append('not', document.getElementById('f_not').value);
      } else if (aktifSekme === 'alisveris') {
        params.append('islem', 'alisverisEkle');
        params.append('urun', document.getElementById('f_urun').value);
        params.append('adet', document.getElementById('f_adet').value);
        params.append('ekleyen', document.getElementById('f_ekleyen').value);
      } else if (aktifSekme === 'istekler') {
        params.append('islem', 'istekEkle');
        params.append('link', document.getElementById('f_link').value);
        params.append('ad', document.getElementById('f_ad').value);
        params.append('fiyat', document.getElementById('f_fiyat').value);
        params.append('ekleyen', document.getElementById('f_ekleyen').value);
      }

      if (API_URL && !API_URL.includes("BURAYA_EXEC")) {
        yukleniyorGoster(true);
        fetch(`${API_URL}?${params.toString()}`, { method: 'GET', redirect: 'follow' })
          .then(res => res.json())
          .then(data => {
            appVerisi = data;
            ekraniGuncelle();
            modalKapat();
          })
          .catch(() => {
            modalKapat();
            verileriYukle();
          })
          .finally(() => yukleniyorGoster(false));
      } else {
        modalKapat();
      }
    }

    function alisverisTamamla(index) {
      if (API_URL && !API_URL.includes("BURAYA_EXEC")) {
        yukleniyorGoster(true);
        fetch(`${API_URL}?islem=alisverisSil&index=${index}`, { method: 'GET', redirect: 'follow' })
          .then(res => res.json())
          .then(data => {
            appVerisi = data;
            ekraniGuncelle();
          })
          .finally(() => yukleniyorGoster(false));
      } else {
        appVerisi.alisveris.splice(index, 1);
        ekraniGuncelle();
      }
    }

    function kameraAc() {
      document.getElementById('kameraKutusu').classList.remove('hidden');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          document.getElementById('f_barkod').value = decodedText;
          kameraKapat();
          barkodlaUrunAra(decodedText);
        },
        () => {}
      ).catch(() => alert("Kamera açılamadı, Safari izinlerini kontrol edin."));
    }

    function kameraKapat() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('kameraKutusu').classList.add('hidden');
        }).catch(() => {});
      }
    }

    function yukleniyorGoster(durum) {
      document.getElementById('yukleniyor').classList.toggle('hidden', !durum);
    }
  </script>
</body>
</html>
